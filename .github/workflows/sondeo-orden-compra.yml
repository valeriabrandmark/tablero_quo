name: Sondeo Orden de Compra Sigma

# ============================================================================
#  PREGUNTA, NO CARGA.
#
#  Corre `probar_sigma_orden_compra.py`, que le pregunta a la API de SIGMA con
#  que metodo se llama a `importordendecompra` y que campos pide el cuerpo.
#  Sin esas dos cosas no se puede escribir el boton del tablero que manda la
#  orden, y la documentacion de la API v10 no es publica.
#
#  POR QUE ACA Y NO EN LA COMPU. Las credenciales de SIGMA ya viven en los
#  secrets de este repo. Correrlo local obliga a copiar el token a un .env a
#  mano -- mas pasos y una copia mas del token dando vueltas.
#
#  Se dispara A MANO. Cuando sepamos la respuesta, este workflow se borra.
#
#  LO QUE YA CONTESTO (corridas del 08/09):
#
#      GET ImportOrdenDeCompra         -> 500 "Parametro content requerido"
#      GET  con content en la query    -> 500 "El formato del JSON es incorrecto"
#      POST con content de formulario  -> 500 "El formato del JSON es incorrecto"
#      POST {"content": basura}        -> 500 "Empresa Obligatoria"
#      POST {"content": basura,
#            "Empresa": "ZZZ"}         -> 500 "Empresa Obligatoria"  <-- igual
#
#  O sea: la ruta existe y se llama con POST y cuerpo JSON. Y `Empresa` no va
#  al lado de `content` -- ponerlo ahi no cambio nada-- sino ADENTRO. Falta
#  saber si `content` viaja como cadena JSON o como objeto, y que mas pide.
#
#  LO UNICO QUE PUEDE ESCRIBIR esta detras de DOS puertas: hay que marcar
#  `sondear_formato` y ademas escribir SI en `confirmo`. Y la garantia de
#  fondo: `campos` llena SOLO cabecera, nunca renglones, y los valores van
#  inventados. Una orden de compra sin articulos y con una empresa que no
#  existe no es una compra que SIGMA pueda crear.
# ============================================================================

on:
  workflow_dispatch:
    inputs:
      sondear_formato:
        description: 'Mandar tambien `content` con basura, para que Sigma diga que formato espera'
        type: boolean
        required: false
        default: false
      campos:
        description: 'Campos de CABECERA, separados por ";". Ej: Empresa=ZZZ;Deposito=ZZZ'
        required: false
        default: ''
      confirmo:
        description: 'Escribi SI para autorizar ese envio (si lo dejas vacio, no se manda)'
        required: false
        default: ''

jobs:
  sondear:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      TZ: America/Argentina/Buenos_Aires

      SIGMA_TOKEN: ${{ secrets.SIGMA_TOKEN }}
      SIGMA_URL_CLIENTE: ${{ secrets.SIGMA_URL_CLIENTE }}
      SIGMA_ID_CLIENTE: ${{ secrets.SIGMA_ID_CLIENTE }}
      SIGMA_BASEALIAS: ${{ secrets.SIGMA_BASEALIAS }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Sondear
        run: |
          python probar_sigma_orden_compra.py \
            ${{ inputs.sondear_formato && '--sondear-formato' || '' }} \
            --campos "${{ inputs.campos }}" \
            --confirmo "${{ inputs.confirmo }}"
