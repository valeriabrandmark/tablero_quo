name: Sondeo Orden de Compra Sigma

# ============================================================================
#  PREGUNTA, NO CARGA.
#
#  Corre `probar_sigma_orden_compra.py`, que le pregunta a la API de SIGMA con
#  que metodo se llama a `importordendecompra` y que campos pide el cuerpo.
#  Sin esas dos cosas no se puede escribir el boton del tablero que manda la
#  orden, y la documentacion de la API v10 no es publica.
#
#  POR QUE ACA Y NO EN LA COMPU. Las credenciales de SIGMA ya viven en los
#  secrets de este repo. Correrlo local obliga a copiar el token a un .env a
#  mano -- mas pasos y una copia mas del token dando vueltas.
#
#  Se dispara A MANO. Cuando sepamos la respuesta, este workflow se borra.
#
#  LO QUE YA CONTESTO (08/09), en orden:
#
#      GET ImportOrdenDeCompra    -> 500 "Parametro content requerido"
#      POST con cuerpo JSON       -> 500 "Empresa Obligatoria"
#      ...con frecdia: 10         -> 500 invalid input syntax for type date: "10"
#      ...sin frecdia             -> 500 "Query with RESPONSE_CODE returned no rows"
#      ...con frecdia como fecha  -> el mismo
#      ...+ vencimiento           -> el mismo
#      ...+ usuario               -> el mismo
#
#  O sea: la ruta existe, se llama con POST y cuerpo JSON, el cuerpo pasa TODAS
#  las validaciones documentadas, y aun asi no entra. Ya no hay nada que
#  deducir del JSON.
#
#  POR ESO ESTE WORKFLOW AHORA PUEDE MANDAR UNA ORDEN DE VERDAD. Cada hipotesis
#  que quedaba costaba un merge, un pull y un deploy del tablero para probarse;
#  aca se prueba apretando "Run workflow", y `campos` permite pisar o SACAR
#  cualquier campo de la cabecera sin tocar codigo.
#
#  LO QUE PUEDE ESCRIBIR sigue detras de DOS puertas: hay que elegir la accion
#  y escribir SI en `confirmo`. Y mandar una orden no tiene articulo ni precio
#  por defecto: sin `item` no manda nada. Es a proposito -- un articulo de
#  ejemplo en un script es la forma mas facil de cargarle a un proveedor algo
#  que nadie pidio.
#
#  SI UNA ORDEN ENTRA, HAY QUE ANULARLA EN SIGMA. Desde aca no se puede borrar.
# ============================================================================

on:
  workflow_dispatch:
    inputs:
      accion:
        description: 'Qué hacer'
        type: choice
        required: true
        default: mirar
        options:
          - mirar
          - sondear-formato
          - mandar-orden
      campos:
        description: 'Pisar campos de cabecera, separados por ";". Vacío = sacar el campo. Ej: frecdia=;estado=S'
        required: false
        default: ''
      item:
        description: 'El renglón. Ej: articuloId=AL26011;precio=14968.8;cantidad=1;unidadDeCompra=U'
        required: false
        default: ''
      confirmo:
        description: 'Escribi SI para autorizar ese envio (si lo dejas vacio, no se manda)'
        required: false
        default: ''

jobs:
  sondear:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      TZ: America/Argentina/Buenos_Aires

      SIGMA_TOKEN: ${{ secrets.SIGMA_TOKEN }}
      SIGMA_URL_CLIENTE: ${{ secrets.SIGMA_URL_CLIENTE }}
      SIGMA_ID_CLIENTE: ${{ secrets.SIGMA_ID_CLIENTE }}
      SIGMA_BASEALIAS: ${{ secrets.SIGMA_BASEALIAS }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Sondear
        run: |
          python probar_sigma_orden_compra.py \
            ${{ inputs.accion == 'sondear-formato' && '--sondear-formato' || '' }} \
            ${{ inputs.accion == 'mandar-orden' && '--mandar-orden' || '' }} \
            --campos "${{ inputs.campos }}" \
            --item "${{ inputs.item }}" \
            --confirmo "${{ inputs.confirmo }}"
