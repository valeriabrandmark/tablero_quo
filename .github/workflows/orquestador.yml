name: Orquestador

# ============================================================================
#  El pipeline de datos, corriendo en GitHub en vez de en una PC de la oficina.
#
#  Antes esto era una tarea del Programador de Windows. Eso significaba que si
#  la maquina estaba apagada, dormida, con la sesion cerrada o con el "detener
#  si el equipo empieza a usar la bateria" tildado, el tablero se quedaba viejo
#  sin que nadie se enterara. Paso mas de una vez.
# ============================================================================

on:
  # Los horarios van en UTC, SIEMPRE. Argentina es UTC-3, asi que hay que
  # restarle 3 a la hora de aca para escribirla en el cron.
  #
  # El minuto 20 y no el 0 es a proposito: la cola de GitHub se llena en las
  # horas redondas -- todo el mundo programa a las 0 -- y ahi los atrasos son
  # de media hora. En el minuto 20 arranca mucho mas cerca de lo pedido.
  schedule:
    # CADA HORA, LAS 24. 24 corridas por dia.
    #
    # Sin lista de horas y sin cruces de medianoche justamente porque son todas:
    # este cron no necesita traducirse de hora argentina a UTC. Si alguna vez se
    # vuelve a recortar a un rango, ahi si hay que SUMARLE 3 a cada hora
    # argentina para escribirla aca, y las que pasen de 21 caen al dia UTC
    # siguiente (22 ART = 01 UTC).
    #
    # POR QUE LAS 24 Y NO SOLO EL HORARIO COMERCIAL. Antes estaba recortado a 9
    # corridas para no pagar los minutos de Actions. Ese motivo desaparecio: el
    # repo es publico y en repos publicos Actions no cobra minutos, asi que 24
    # cuesta lo mismo que 9 -- nada.
    #
    # Lo que se gana con la madrugada es chico pero real: a las 08 el tablero ya
    # esta al dia en vez de esperar la primera corrida. Lo que se paga son 15
    # llamadas mas por dia a las APIs de SIGMA, ML, Tienda Nube y Digip, y algo
    # mas de trafico contra Supabase. Ninguna de las dos cosas esta cerca de
    # ningun limite hoy, pero SI ESTE REPO SE VUELVE PRIVADO hay que volver a
    # recortar: 24 corridas son ~5.000 min/mes contra 2.000 incluidos.
    - cron: '20 * * * *'

  # El boton de "Run workflow" en la pestaña Actions. Sirve para forzar una
  # corrida despues de tocar algo, sin esperar al horario.
  workflow_dispatch:

# UNA CORRIDA POR VEZ. Es lo mas importante de este archivo.
#
# Dos orquestadores simultaneos escriben las mismas tablas: uno borra la ventana
# movil mientras el otro la esta insertando. El 21/08/2026 una version de eso
# dejo 2.548 ordenes duplicadas.
#
# `cancel-in-progress: false` porque cancelar es PEOR que esperar: mataria una
# corrida a mitad de camino, con la mitad de los pasos hechos. La nueva espera
# a que termine la anterior.
concurrency:
  group: orquestador
  cancel-in-progress: false

jobs:
  correr:
    runs-on: ubuntu-latest
    # Una corrida normal son ~6-8 min, y ~21 min la que le toca el catalogo de
    # Mercado Libre. Con este horario esa es SIEMPRE la de las 00:20, que es la
    # primera del dia calendario y la que `primera_del_dia` engancha: el paso
    # caro cae en la hora en la que no lo espera nadie.
    #
    # 55 y no 45: el orquestador tiene su PROPIO presupuesto de 50 minutos, y
    # los dos topes tienen que estar en ese orden. Con el techo del job por
    # debajo, GitHub mata el proceso de un hachazo antes de que el orquestador
    # llegue a cortarse solo -- y ahi se pierde el paso de subir el log, que es
    # justo el que hace falta para entender por que tardo tanto. Con 55, el
    # presupuesto interno salta primero y la corrida termina ordenada.
    #
    # Que 55 sea menos que el intervalo de 60 no es lo que evita que dos
    # corridas se pisen; de eso se encarga `concurrency` mas abajo, que aguanta
    # igual si una corrida se atrasa en la cola.
    timeout-minutes: 55

    env:
      # EL RUNNER CORRE EN UTC Y HAY 16 LUGARES EN EL CODIGO QUE USAN
      # `date.today()` PARA ARMAR LA VENTANA MOVIL.
      #
      # Sin esto, entre las 21 y la medianoche de Argentina el runner ya esta en
      # el dia siguiente y las ventanas se corren un dia entero. Python respeta
      # esta variable en Linux -- verificado: sin TZ da 15:13, con TZ da 12:13.
      TZ: America/Argentina/Buenos_Aires

      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASS: ${{ secrets.DB_PASS }}
      DB_NAME: ${{ secrets.DB_NAME }}

      SIGMA_TOKEN: ${{ secrets.SIGMA_TOKEN }}
      SIGMA_URL_CLIENTE: ${{ secrets.SIGMA_URL_CLIENTE }}
      SIGMA_ID_CLIENTE: ${{ secrets.SIGMA_ID_CLIENTE }}
      SIGMA_BASEALIAS: ${{ secrets.SIGMA_BASEALIAS }}

      ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
      ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
      ML_REDIRECT_URI: ${{ secrets.ML_REDIRECT_URI }}
      ML_USER_ID: ${{ secrets.ML_USER_ID }}

      TN_STORE_ID: ${{ secrets.TN_STORE_ID }}
      TN_TOKEN: ${{ secrets.TN_TOKEN }}
      TN_USER_AGENT: ${{ secrets.TN_USER_AGENT }}

      DIGIP_API_KEY: ${{ secrets.DIGIP_API_KEY }}
      DIGIP_URL_BASE: ${{ secrets.DIGIP_URL_BASE }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          # Cachea las dependencias entre corridas. Sin esto cada corrida se
          # baja pandas y numpy de nuevo: mas de un minuto de los seis, pagado.
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      # Un segundo, sin red ni base. El orquestador comparte el token de
      # Mercado Libre con el workflow de la antiguedad, que corre en paralelo:
      # si el candado que los ordena se rompe, el sintoma aparece en la corrida
      # SIGUIENTE, con un invalid_grant que hay que arreglar reautorizando a
      # mano. Mejor enterarse antes de arrancar.
      - name: Probar el candado del token
        run: python probar_candado_token.py

      - name: Probar los reintentos de la API
        run: python probar_reintentos_ml.py

      - name: Correr el orquestador
        run: python orquestador.py

      # El log queda igual en la consola de Actions, pero como archivo se puede
      # bajar y comparar con el de otra corrida. Se guarda tambien cuando el
      # paso anterior fallo, que es justo cuando mas se necesita.
      - name: Guardar el log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-${{ github.run_number }}
          path: orquestador_log.txt
          retention-days: 14
          if-no-files-found: ignore
