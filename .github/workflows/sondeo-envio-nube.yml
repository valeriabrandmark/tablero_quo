name: Sondeo Envio Nube

# ============================================================================
#  MIRA, NO TOCA.
#
#  Corre `explorar_tn_envio_nube.py`, que le pregunta a la API de Tienda Nube
#  por los fulfillment-orders de unos pedidos e imprime el bloque de envio. NO
#  escribe en la base y NO forma parte del pipeline: existe para saber si la API
#  trae el costo REAL de la etiqueta de Envio Nube antes de sumarlo a
#  tiendanube.py.
#
#  Se dispara A MANO --pestaña Actions, "Run workflow"--. Una vez contestada la
#  pregunta, este workflow no hace falta mas y se puede borrar.
# ============================================================================

on:
  workflow_dispatch:
    inputs:
      pedidos:
        description: 'IDs de pedido (no el numero), separados por espacio. Vacio = los de referencia'
        required: false
        default: ''

jobs:
  sondear:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      TN_STORE_ID: ${{ secrets.TN_STORE_ID }}
      TN_TOKEN: ${{ secrets.TN_TOKEN }}
      TN_USER_AGENT: ${{ secrets.TN_USER_AGENT }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      # El sondeo importa la configuracion de tiendanube.py, y ese modulo trae
      # pandas y sqlalchemy al importarse: hace falta el requirements entero
      # aunque no se toque la base.
      - name: Instalar dependencias
        run: pip install -r requirements.txt

      # El input pasa por una variable y no pegado en el comando, para que lo
      # que se escriba en el formulario no se pueda ejecutar como shell.
      - name: Sondear
        env:
          PEDIDOS: ${{ inputs.pedidos }}
        run: python explorar_tn_envio_nube.py $PEDIDOS
