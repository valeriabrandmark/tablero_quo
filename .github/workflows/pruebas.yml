name: Pruebas

# ============================================================================
#  LO QUE SE PUEDE VERIFICAR ANTES DE MERGEAR, VERIFICADO ANTES DE MERGEAR.
#
#  Existe por una corrida perdida: un requirements.txt con `rsa==4.9.2` --una
#  version que no existe-- se mergeo sin que nada lo notara y tumbo las tres
#  corridas siguientes del orquestador en el paso de instalar dependencias.
#  El error tardaba tres segundos en aparecer; lo caro fue que aparecio recien
#  en produccion.
#
#  Esto corre en cada pull request y no toca la base ni la red: instala las
#  dependencias --que es lo que fallo-- y corre las pruebas que no necesitan
#  credenciales. Menos de un minuto.
# ============================================================================

on:
  pull_request:
  workflow_dispatch:

# Sin secretos a proposito: si una prueba necesitara credenciales, no es una
# prueba para este workflow.
permissions:
  contents: read

concurrency:
  group: pruebas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      # EL PASO QUE HABRIA ATAJADO EL PROBLEMA. Una version inventada en
      # requirements.txt muere aca, en el pull request, y no en la corrida de
      # las 3 de la manana.
      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Probar la cuenta de la antiguedad
        run: python probar_fifo_antiguedad.py

      - name: Probar el candado del token
        run: python probar_candado_token.py

      - name: Probar los reintentos de la API
        run: python probar_reintentos_ml.py

      - name: Probar el lector de sell in
        run: python probar_sell_in.py

      # El mes comercial decide que lista de costos se le aplica a cada venta.
      # Una fecha en el mes equivocado no se ve como un error: se ve como un
      # margen raro, o como una venta sin costo.
      - name: Probar el mes comercial
        run: python probar_mes_comercial.py

      # Las tres de la carga de costos. La primera frena un Excel con la coma
      # decimal borrada; la segunda cuida desde que dia rige cada lista y desde
      # cuando hay que recalcular gold; la tercera, que el paso que existe para
      # NO recargar de gusto siga decidiendo bien.
      - name: Probar el control de costos que saltan
        run: python probar_costos_saltos.py

      - name: Probar las vigencias de costos
        run: python probar_costos_vigencia.py

      - name: Probar la huella de los Excel
        run: python probar_huella_costos.py

      # De esta tabla sale la pata de INGRESOS de la trazabilidad de Full:
      # contra ella se compara lo que Mercado Libre declara. Un item contado de
      # mas hace ver un faltante de ML donde no lo hay.
      - name: Probar el lector de envios a Full
        run: python probar_envios_full.py

      # Bajar de menos es peor que fallar: el guardado BORRA la ventana antes
      # de insertar, asi que media ventana en la mano se lleva puesto el resto.
      # El 06/08/2026 eso dejo 622 minutos sin una sola venta de ML.
      - name: Probar que una pagina vacia de ML corte la bajada
        run: python probar_pagina_vacia_ml.py

      # LA PRUEBA MAS CARA DE APRENDER DEL REPO. Este guardado duplico datos
      # dos veces --2.548 ordenes de ML el 21/08, 31 lineas de SIGMA el 14/08--
      # y las dos sin que nada fallara. Lo que se fija no es que guarde bien
      # cuando todo anda, sino que EXPLOTE cuando no puede garantizarlo.
      - name: Probar el guardado por ventana movil
        run: python probar_guardado_ventana.py

      # Que todos los scripts al menos compilen. No prueba que anden, pero un
      # error de sintaxis en un archivo que nadie importa en las pruebas
      # tambien tumba la corrida, y eso se ve gratis.
      - name: Que todo compile
        run: python -m compileall -q .
